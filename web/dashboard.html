<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SilentBeat — Dashboard</title>
<link rel="icon" type="image/svg+xml" href="brand/favicon.svg" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<main class="page page-app">

  <nav class="appnav">
    <a href="/" class="brand">
      <span class="name">silentbeat</span>
      <span class="blip" aria-hidden="true"></span>
    </a>
    <div class="appnav-links">
      <a href="/dashboard.html" class="active">dashboard</a>
      <a href="/log.html">log</a>
      <a href="/settings">settings</a>
    </div>
  </nav>

  <header class="status-row">
    <div>
      <h2 class="h-hand status-title" id="status-title">loading…</h2>
      <div class="t-soft status-sub" id="status-sub"></div>
    </div>
    <div class="alive-pill" id="alive-pill" style="display: none;">
      <span class="blip" aria-hidden="true"></span>
      <span class="t-mono" id="alive-label">ALIVE</span>
    </div>
  </header>

  <section class="wobble countdown-card">
    <div class="card-label t-mono">TIME UNTIL RELEASE</div>
    <div class="countdown" id="countdown" data-expires="">
      <div class="cd-cell"><div class="cd-val">--</div><div class="cd-label t-mono">days</div></div>
      <div class="cd-sep">:</div>
      <div class="cd-cell"><div class="cd-val">--</div><div class="cd-label t-mono">hrs</div></div>
      <div class="cd-sep">:</div>
      <div class="cd-cell"><div class="cd-val">--</div><div class="cd-label t-mono">min</div></div>
      <div class="cd-sep">:</div>
      <div class="cd-cell"><div class="cd-val">--</div><div class="cd-label t-mono">sec</div></div>
    </div>
    <div class="t-soft expires-line">expires <span id="expires-at">—</span></div>
    <div class="card-actions">
      <a id="checkin-btn" class="btn btn-primary" href="/checkin.html">check in &rarr;</a>
      <a class="btn" href="/create.html">new switch</a>
    </div>
  </section>

  <section class="panel-grid">
    <div class="wobble panel">
      <div class="panel-label t-mono">RECENT</div>
      <div class="t-mono panel-list" id="recent-list"><div class="t-soft">—</div></div>
    </div>
    <div class="wobble panel">
      <div class="panel-label t-mono">SAFETY NETS</div>
      <div class="panel-list" id="safety-list">
        <div><span class="ok">ok</span> daily reminder email</div>
        <div id="passkey-line"><span class="t-soft">…</span> passkey</div>
        <div><span class="ok">ok</span> recovery contact set</div>
      </div>
      <div id="passkey-action" style="margin-top: 10px; display: none;">
        <button id="register-passkey-btn" class="btn btn-tiny" type="button">register passkey on this device</button>
        <div id="passkey-status" class="t-soft" style="font-size: 11px; margin-top: 6px; min-height: 14px;"></div>
      </div>
    </div>
    <div class="wobble panel panel-danger">
      <div class="panel-label t-mono">DANGER ZONE</div>
      <div class="danger-actions">
        <button id="purge-btn" class="btn btn-tiny btn-danger" type="button">destroy payload</button>
      </div>
    </div>
  </section>

</main>

<script src="/app.js"></script>
<script>
  SB.requireAuth();
  const cells = document.querySelectorAll('#countdown .cd-val');
  let activeSwitch = null;
  let tickHandle = null;

  function setEmpty() {
    document.getElementById('status-title').textContent = 'no switches yet.';
    document.getElementById('status-sub').textContent = 'create one to get started.';
    document.getElementById('checkin-btn').textContent = 'create switch →';
    document.getElementById('checkin-btn').href = '/create.html';
    cells.forEach(c => c.textContent = '--');
    document.getElementById('expires-at').textContent = '—';
    document.getElementById('purge-btn').style.display = 'none';
  }

  function setActive(sw) {
    activeSwitch = sw;
    const pendingEnroll = sw.status === 'pending' && sw.recipient_status !== 'enrolled';
    const readyFinalize = sw.status === 'pending' && sw.recipient_status === 'enrolled';
    const label = sw.status === 'armed' ? 'your switch is armed.' :
                  pendingEnroll ? 'awaiting recipient enrollment…' :
                  readyFinalize ? 'recipient enrolled — ready to finalize.' :
                  sw.status === 'released' ? 'switch released.' :
                  sw.status === 'duress_purged' ? 'switch released (duress).' :
                  sw.status === 'user_purged' ? 'switch destroyed.' :
                  sw.status;
    document.getElementById('status-title').textContent = label;
    document.getElementById('status-sub').textContent =
      'last check-in ' + SB.timeAgo(sw.last_checkin_at) + ' · timer ' + Math.round(sw.timer_seconds / 86400) + 'd';
    if (sw.status === 'armed') document.getElementById('alive-pill').style.display = 'flex';
    document.getElementById('expires-at').textContent = sw.status === 'armed' ? SB.fmtUTC(sw.expiry_at) : '—';

    const btn = document.getElementById('checkin-btn');
    if (sw.status === 'armed') {
      btn.href = '/checkin.html?id=' + sw.id; btn.textContent = 'check in →'; btn.style.display = '';
    } else if (sw.status === 'pending') {
      btn.href = '/finalize.html?id=' + sw.id;
      btn.textContent = readyFinalize ? 'finalize switch →' : 'view finalize page →';
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
    document.getElementById('purge-btn').dataset.id = sw.id;
    if (sw.status === 'armed') { tick(); tickHandle = setInterval(tick, 1000); }
  }

  function tick() {
    if (!activeSwitch) return;
    const ms = activeSwitch.expiry_at - Date.now();
    const t = SB.msToDhms(ms);
    cells[0].textContent = SB.pad(t.d);
    cells[1].textContent = SB.pad(t.h);
    cells[2].textContent = SB.pad(t.m);
    cells[3].textContent = SB.pad(t.s);
  }

  document.getElementById('purge-btn').addEventListener('click', async () => {
    if (!activeSwitch || !confirm('Permanently destroy the encrypted payload? This cannot be undone.')) return;
    try {
      await SB.api('/api/switches/' + activeSwitch.id, { method: 'DELETE' });
      location.reload();
    } catch (e) {
      alert('failed: ' + e.message);
    }
  });

  async function refreshPasskeyPanel() {
    try {
      const me = await SB.api('/api/auth/me');
      const n = (me.user && me.user.passkey_count) || 0;
      const line = document.getElementById('passkey-line');
      const action = document.getElementById('passkey-action');
      if (n > 0) {
        line.innerHTML = '<span class="ok">ok</span> passkey enrolled (' + n + ')';
        action.style.display = 'none';
      } else {
        line.innerHTML = '<span class="t-soft">—</span> no passkey enrolled';
        action.style.display = window.PublicKeyCredential ? 'block' : 'none';
      }
    } catch {}
  }

  document.getElementById('register-passkey-btn').addEventListener('click', async (e) => {
    const btn = e.currentTarget;
    const status = document.getElementById('passkey-status');
    btn.disabled = true; status.textContent = 'awaiting your authenticator…';
    try {
      await SB.registerPasskey();
      status.textContent = 'enrolled.';
      await refreshPasskeyPanel();
    } catch (err) {
      if (err && err.name === 'NotAllowedError') status.textContent = 'cancelled.';
      else status.textContent = 'failed: ' + (err && err.message ? err.message : 'unknown');
      btn.disabled = false;
    }
  });

  (async () => {
    try {
      const r = await SB.api('/api/switches');
      const list = r.switches || [];
      const sw = list.find(s => s.status === 'armed') || list[0];
      if (sw) setActive(sw);
      else setEmpty();
    } catch (e) {
      if (e.status === 401) { SB.clearSession(); location.replace('/signin.html'); return; }
      document.getElementById('status-title').textContent = 'error loading: ' + e.message;
    }
    refreshPasskeyPanel();
  })();
</script>

</body>
</html>
