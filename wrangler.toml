name = "silentbeat-staging"
main = "worker/src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./web"
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "silentbeat"
database_id = "0e69b0d2-5783-44c7-8735-4de87df67af4"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PAYLOADS"
bucket_name = "silentbeat-payloads"

[[kv_namespaces]]
binding = "SESSIONS"
id = "5945a80e26a54148af5b40475c201c7c"

[[durable_objects.bindings]]
name = "SWITCH_TIMER"
class_name = "SwitchTimer"

[[durable_objects.bindings]]
name = "AUDIT_LOGGER"
class_name = "AuditLogger"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SwitchTimer"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AuditLogger"]

[triggers]
crons = ["*/5 * * * *"]

[vars]
ENVIRONMENT = "production"
PUBLIC_BASE_URL = "https://silentbeat.app"
RP_ID = "silentbeat.app"
RP_NAME = "SilentBeat"
RP_ORIGIN = "https://silentbeat.app"
EMAIL_FROM = "SilentBeat <noreply@silentbeat.app>"
# Secrets (set with `wrangler secret put NAME`):
#   MASTER_KEY        — 32 bytes b64, AES-GCM master for KMS-style DEK wrapping
#   LOG_SIGNING_KEY   — Ed25519 PKCS8 b64, signs every audit_log entry
#   LOG_PUBLIC_KEY    — Ed25519 SPKI b64, published so anyone can verify the chain
#   RESEND_API_KEY    — Resend API key for outbound email; absent in dev → console.log
