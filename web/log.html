<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SilentBeat — Public log</title>
<link rel="icon" type="image/svg+xml" href="brand/favicon.svg" />
<meta name="theme-color" content="#0f1012" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="silentbeat" />
<meta name="format-detection" content="telephone=no" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/brand/favicon.svg" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<main class="page page-app">

  <nav class="appnav">
    <a href="/" class="brand">
      <span class="name">silentbeat</span>
      <span class="blip" aria-hidden="true"></span>
    </a>
    <div class="appnav-links">
      <a href="/dashboard.html">dashboard</a>
      <a href="/log.html" class="active">log</a>
      <a href="/settings">settings</a>
    </div>
  </nav>

  <header class="log-header">
    <div>
      <h1 class="h-hand" style="font-size: 32px; margin: 0;">public log</h1>
      <div class="t-soft" style="font-size: 13px; margin-top: 2px;">append-only · merkle-rooted · refreshes every 60s</div>
    </div>
    <div class="log-actions">
      <a class="btn btn-sm" href="/log/verify">verify root ↑</a>
      <a class="btn btn-sm" href="/log/export.csv">download CSV</a>
    </div>
  </header>
  <svg class="underline-sketch" width="120" height="10" viewBox="0 0 120 10" aria-hidden="true">
    <path d="M2 6 Q 30 1, 60 5 T 118 4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" />
  </svg>

  <div class="wobble log-table">
    <div class="t-mono log-rows" id="log-rows">
      <div class="log-row log-head">
        <span class="log-time">time</span>
        <span class="log-event">event</span>
        <span class="log-hash">switch hash</span>
        <span class="log-actor">actor</span>
        <span class="log-seq">seq</span>
      </div>
    </div>
  </div>

  <div class="log-foot">
    <span class="t-soft t-mono">root: 4a91b0c2…0e7f — signed by silentbeat-prod</span>
    <span class="t-soft">we cannot delete entries. only append.</span>
  </div>

</main>

<script src="/app.js"></script>
<script>
  const eventLabel = {
    switch_created: 'create',
    switch_armed: 'armed',
    checkin: 'defuse',
    release: 'release',
    duress_release: 'duress',
    user_purge: 'purge',
    recipient_enrolled: 'enroll',
    test_fire: 'test',
  };

  function fmt(t) {
    const d = new Date(t);
    return d.toISOString().replace('T', ' ').replace(/\.\d+Z$/, 'Z');
  }

  (async () => {
    const container = document.getElementById('log-rows');
    try {
      const r = await SB.api('/api/log?limit=50');
      const entries = r.entries || [];
      if (!entries.length) {
        const empty = document.createElement('div');
        empty.className = 'log-row t-faint';
        empty.style.gridColumn = '1 / -1';
        empty.textContent = 'no entries yet — create a switch to populate the log.';
        container.appendChild(empty);
      }
      for (const e of entries) {
        const div = document.createElement('div');
        const label = eventLabel[e.event] || e.event;
        div.className = 'log-row log-event-' + (label === 'release' || label === 'duress' ? 'release' :
                                                 label === 'defuse' ? 'defuse' :
                                                 label === 'create' ? 'create' : '');
        div.innerHTML =
          '<span class="log-time t-faint">' + fmt(e.at) + '</span>' +
          '<span class="log-event">' + label + '</span>' +
          '<span class="log-hash">sw#' + (e.switch_id_hash || '').slice(0, 12) + '…</span>' +
          '<span class="log-actor t-faint">' + (e.event === 'release' ? 'cron' : 'user') + '</span>' +
          '<span class="log-seq t-faint">' + e.seq + '</span>';
        container.appendChild(div);
      }
      // Update root display
      const root = await SB.api('/api/log/root');
      const rootSpan = document.querySelector('.log-foot .t-mono');
      if (rootSpan) rootSpan.textContent = 'root: ' + (root.root || '').slice(0, 8) + '…' + (root.root || '').slice(-4) + ' — signed by silentbeat';
    } catch (e) {
      const err = document.createElement('div');
      err.className = 'log-row';
      err.style.gridColumn = '1 / -1';
      err.style.color = 'var(--accent)';
      err.textContent = 'error: ' + e.message;
      container.appendChild(err);
    }
  })();
</script>

</body>
</html>
